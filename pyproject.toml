[project]
name = "easyannotate"
version = "0.4.0"
description = "Image annotation with nothing to set up: draw, review model predictions fast, export a correct dataset"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Shivpratap Singh Panwar" }]
keywords = [
    "annotation", "labeling", "image-annotation", "computer-vision", "dataset",
    "bounding-box", "polygon", "pascal-voc", "coco", "yolo", "labelme",
    "active-learning", "cvat-alternative", "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Utilities",
    "Typing :: Typed",
]

# Headless OpenCV by default. opencv-python links against libGL and libglib,
# which slim containers, Cloud Run, Lambda and most CI images do not have --
# so the ordinary build turns "pip install" into an ImportError at runtime on
# exactly the machines a web backend runs on. Only collect.webcam's preview
# window needs the GUI build; everything else is headless-safe.
#
# The web stack is part of the base install. The editor *is* the product, and
# "pip install easyannotate" followed by an error asking for an extra is the
# opposite of the promise. It costs a few megabytes and no compiled code.
dependencies = [
    "fastapi>=0.110",
    "imagehash>=4.3.2",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
# Swap in the GUI build for collect.webcam's live preview and the standalone
# annotation tools. Installing this replaces opencv-python-headless; do not
# install both into one environment.
gui = ["opencv-python>=4.10"]

# The HTTP service. Kept out of the core so a CLI user does not pull a web
# framework, and a container that only runs the CLI stays small.
# Kept so existing `pip install "...[web]"` commands still resolve. The web
# stack is in the base install now.
web = []

# `easyannotate app`: a native window instead of a browser tab. Optional
# because it pulls a platform web-view binding (pythonnet on Windows); the
# browser path works without it.
desktop = ["pywebview>=5.0"]

# SAM-assisted segmentation.
#
# REMOVED, not fixed. It used to read `sam = ["torch>=2.2", "sam2>=1.0"]`, and
# `sam2` is not published on PyPI under that name -- Meta ships it from GitHub
# -- so `pip install "data-factory[sam]"` failed at resolution. An extra that
# cannot install is worse than one that does not exist: it advertises a feature
# and then blames the user's environment.
#
# The deeper reason it is gone is that an extra installs into the *same*
# environment, which puts torch's version matrix in the way of a tool whose
# core needs numpy and Pillow. Heavy models run behind a process boundary
# instead (see data_factory/annotate/tools/), so they are a separate
# distribution with its own interpreter, discovered at runtime and absent
# without complaint. Point DATAFACTORY_TOOLS_MODULE at one to enable it.

# Everything a contributor needs.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pycocotools>=2.0.7",   # verifies our COCO export against the reference reader
    "piexif>=1.1.3",        # writes the EXIF-tagged images the real data never had
    "httpx",                # the FastAPI test client
    "build>=1.2",
    "playwright>=1.45",     # drives the editor in a real browser
]

[project.urls]
Homepage = "https://github.com/shivpratapsinghpanwar/EasyAnnotate"
Source = "https://github.com/shivpratapsinghpanwar/EasyAnnotate"
Issues = "https://github.com/shivpratapsinghpanwar/EasyAnnotate/issues"
Changelog = "https://github.com/shivpratapsinghpanwar/EasyAnnotate/blob/main/CHANGELOG.md"

[project.scripts]
easyannotate = "data_factory.cli.main:main"
datafactory = "data_factory.cli.main:main"
dfx = "data_factory.cli.main:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_factory"]

[tool.hatch.build.targets.sdist]
include = [
    "/data_factory",
    "/tests",
    "/recipes",
    "/examples",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # pycocotools has not caught up with the numpy 2 __array__ signature.
    "ignore::DeprecationWarning:pycocotools.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
