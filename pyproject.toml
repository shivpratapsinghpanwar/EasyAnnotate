[project]
name = "data-factory"
version = "0.2.0"
description = "Computer-vision dataset preparation: cleaning, arranging, verifying and exporting, as one tool"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Shivpratap Singh Panwar" }]
keywords = ["computer-vision", "dataset", "annotation", "pascal-voc", "coco", "deduplication"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Intended Audience :: Developers",
]

dependencies = [
    "imagehash>=4.3.2",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The annotation GUIs and SAM-assisted segmentation need torch; the core
# cleaning/exporting pipeline deliberately does not, so a CI box or a web
# backend can install this package without pulling in a deep-learning stack.
sam = ["torch>=2.2", "sam2>=1.0"]

[project.scripts]
datafactory = "data_factory.cli.main:main"
dfx = "data_factory.cli.main:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
