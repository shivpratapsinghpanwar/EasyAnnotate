[project]
name = "easyannotate-tools"
version = "0.4.0"
description = "Model-backed helpers for EasyAnnotate: SAM 2 masks, text-prompted detection, inference. Runs as a sidecar in its own environment."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Shivpratap Singh Panwar" }]

# A separate distribution on purpose. torch's version matrix must never be
# resolved together with the editor's; this installs into its own venv
# (`easyannotate tools install`) and talks to the editor over a pipe.
dependencies = [
    "easyannotate>=0.4.0",
    "ultralytics>=8.3",
]

[project.urls]
Homepage = "https://shivpratapsinghpanwar.github.io/EasyAnnotate/"
Source = "https://github.com/shivpratapsinghpanwar/EasyAnnotate/tree/main/tools"
Issues = "https://github.com/shivpratapsinghpanwar/EasyAnnotate/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["easyannotate_tools"]
