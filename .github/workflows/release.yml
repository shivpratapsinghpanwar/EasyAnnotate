# A version tag builds everything a user can download and attaches it to a
# GitHub Release: the wheel and sdist, and a desktop bundle per platform.
# Then it publishes easyannotate and easyannotate-tools to PyPI.
#
#   git tag v0.4.0 && git push origin v0.4.0
#
# PyPI uses trusted publishing: no token exists anywhere. On pypi.org each
# project names this repository, this workflow file and the `pypi`
# environment as its publisher, and GitHub proves the run's identity.
#
# Guards against "one typo away from an unwanted version": the tag must equal
# both packages' version or nothing is built; PyPI is touched only after every
# platform built; and a re-run skips files PyPI already has.
#
# The desktop bundles are unsigned here. Windows SmartScreen and macOS
# Gatekeeper will warn until a code-signing certificate and an Apple
# notarisation step are added -- see DEPLOYING.md.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # The tag says which version this is; both packages must agree.
      - shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for file in pyproject.toml tools/pyproject.toml; do
            version=$(grep -m1 '^version = ' "$file" | cut -d'"' -f2)
            if [ "$version" != "$tag" ]; then
              echo "::error::tag $GITHUB_REF_NAME but $file says $version"; exit 1
            fi
          done
      - run: uv build
      # The AI tools ship as their own distribution, versioned with the editor;
      # `easyannotate tools install` fetches it from PyPI once both are up.
      - run: uv build --directory tools --out-dir ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/

  desktop:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: EasyAnnotate-windows-x64
          - os: macos-latest
            bundle: EasyAnnotate-macos-arm64
          - os: ubuntu-latest
            bundle: EasyAnnotate-linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # Not --all-extras: the gui extra is the full opencv-python, which shares
      # its cv2/ folder with the headless build, and the two together leave a
      # half-overwritten module ("partially initialized module 'cv2'").
      - run: uv sync --extra dev --extra desktop
      - run: uv pip install pyinstaller
      # Bundled into the app, with uv, so "Install AI tools" needs nothing of
      # ours from PyPI. PyTorch still downloads on request, never here.
      - run: uv build --wheel --out-dir build/wheels
      - run: uv build --wheel --directory tools --out-dir ../build/wheels
      # pywebview's Linux backend wants GTK or Qt at build time for its hooks.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgirepository1.0-dev gir1.2-webkit2-4.1 || true
      - run: uv run pyinstaller --noconfirm packaging/easyannotate.spec
      # The bundle must start and answer before it is worth shipping.
      - shell: bash
        env:
          EASYANNOTATE_NO_WINDOW: "1"
          BROWSER: "no-such-browser"
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then exe=dist/EasyAnnotate/EasyAnnotate.exe; else exe=dist/EasyAnnotate/EasyAnnotate; fi
          "$exe" > launch.log 2>&1 &
          trap 'echo "--- launch.log"; cat launch.log' EXIT
          for i in $(seq 1 60); do grep -q "interface" launch.log && break; sleep 1; done
          port=$(grep -o "127.0.0.1:[0-9]*" launch.log | head -1 | cut -d: -f2)
          # The banner prints before the server listens; on macOS the first
          # request lost that race (curl exit 7). Ask until it answers.
          for i in $(seq 1 60); do curl -fs "http://127.0.0.1:$port/api/health" && break; sleep 1; done
          curl -fs "http://127.0.0.1:$port/api/health"
          # The local link and the AI-tools card: token in, install plan out.
          # tr: Windows writes the log with CRLF, and a token ending in \r is refused.
          token=$(grep -o "#token=[^ ]*" launch.log | head -1 | cut -d= -f2 | tr -d '\r')
          curl -fs -H "X-Local-Token: $token" "http://127.0.0.1:$port/api/local/tools" | grep -q '"uv":true'
          ls dist/EasyAnnotate/_internal/wheels/*.whl
      - shell: bash
        run: |
          cd dist && if [ "$RUNNER_OS" = "Windows" ]; then 7z a -tzip "../${{ matrix.bundle }}.zip" EasyAnnotate; else zip -qr "../${{ matrix.bundle }}.zip" EasyAnnotate; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle }}
          path: ${{ matrix.bundle }}.zip

  publish:
    needs: [wheel, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/wheel/*
            artifacts/*/*.zip
          generate_release_notes: true

  pypi:
    needs: [wheel, desktop]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/easyannotate/
    permissions:
      id-token: write   # trusted publishing: the run's identity, not a token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
